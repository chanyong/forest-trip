<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>페이지를 찾을 수 없습니다 · 숲가자</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { --bg: #f6f5f0; --ink: #1d2420; --ink-2: #4b5650; --brand: #1f5f3f; --on: #fff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121614; --ink: #e7ece8; --ink-2: #b4bfb8; --brand: #7cc79c; --on: #121614; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; word-break: keep-all; padding: 24px; box-sizing: border-box; }
  main { text-align: center; max-width: 420px; }
  svg { width: 56px; height: 56px; }
  h1 { font-size: 24px; margin: 18px 0 8px; }
  p { color: var(--ink-2); line-height: 1.6; margin: 0 0 24px; }
  a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 12px; background: var(--brand); color: var(--on); font-weight: 700; text-decoration: none; }
  a:focus-visible { outline: 3px solid #2457b0; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1f5f3f"/><path d="M16 5l-7 10h4l-5 7h6v5h4v-5h6l-5-7h4z" fill="#e8f3ea"/></svg>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 없는 페이지입니다. 홈에서 전국 휴양림 빈자리를 다시 찾아보세요.</p>
  <a href="/">숲가자 홈으로</a>
</main>
</body>
</html>
